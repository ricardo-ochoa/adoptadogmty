name: Redeploy Diario Vercel

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Esto te permite darle al botón "Run workflow" para probarlo manualmente

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Hook de Vercel
        run: |
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_WqO1g2Vak1sJZD2GjDSMmcWBI8VR/YLjRM5qfLc"
